name: Lacrei Backend CI/CD

on:
  push:
    branches: ["main"]

jobs:
  integracao-e-entrega:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Instalar Poetry e Dependências
        run: |
          pip install poetry
          poetry install

      - name: 🧹 Executar Lint (Flake8)
        run: |
          # Verifica apenas erros críticos de sintaxe no código
          poetry run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 🧪 Executar Testes Automatizados
        env:
          SECRET_KEY: "chave-secreta-para-testes-no-github"
          DEBUG: "True"
        run: |
          poetry run python manage.py test

      - name: 🏗️ Executar Build (Docker)
        run: |
          docker build -t lacrei-backend:latest .

      - name: 🚀 Executar Deploy (AWS Staging/Prod)
        run: |
          echo "Validando credenciais da AWS..."
          echo "Simulando envio da imagem Docker para o ambiente de Produção/Staging na nuvem."
          echo "Deploy executado com sucesso!"
